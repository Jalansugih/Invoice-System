      // Safe fetch descriptor patch for sandboxed iframe environments
      try {
        let _customFetch = window.fetch ? window.fetch.bind(window) : undefined;
        Object.defineProperty(window, 'fetch', {
          get() {
            return _customFetch;
          },
          set(val) {
            _customFetch = val;
          },
          configurable: true,
          enumerable: true,
        });
      } catch (e) {
        // Fallback if property is not configurable
      }
    </script>
