    <!-- Polyfill / Window fetch getter safety patch -->
    <script>
      (function() {
        try {
          var nativeFetch = window.fetch;
          if (typeof nativeFetch === 'function') {
            var activeFetch = nativeFetch;
            try {
              Object.defineProperty(window, 'fetch', {
                get: function() { return activeFetch; },
                set: function(fn) { activeFetch = typeof fn === 'function' ? fn : activeFetch; },
                configurable: true,
                enumerable: true
              });
            } catch (e) {
              try {
                Object.defineProperty(Window.prototype, 'fetch', {
                  get: function() { return activeFetch; },
                  set: function(fn) { activeFetch = typeof fn === 'function' ? fn : activeFetch; },
                  configurable: true,
                  enumerable: true
                });
              } catch (e2) {}
            }
          }
        } catch (err) {}
      })();
    </script>
